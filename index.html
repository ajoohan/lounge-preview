<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 공개 주소로 배포하더라도 검색엔진에는 걸리지 않게 한다 (내부 검토용 프로토타입) -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Lounge - AI Marketing Board</title>

    <!-- 링크를 카톡·메신저로 보낼 때의 미리보기.
         초대는 링크로 오간다 - 미리보기가 없으면 받는 쪽에서 무엇인지 알 수 없어
         낯선 주소로 보인다. 이미지는 절대 주소여야 읽힌다 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lounge" />
    <meta property="og:title" content="Lounge - AI Marketing Board" />
    <meta
      property="og:description"
      content="마케팅 협업 보드 · 프로젝트 · 검수 · 정산을 한번에."
    />
    <meta property="og:url" content="https://lounge.plustonic.com/" />
    <meta property="og:image" content="https://lounge.plustonic.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lounge - AI Marketing Board" />
    <meta
      name="twitter:description"
      content="마케팅 협업 보드 · 프로젝트 · 검수 · 정산을 한번에."
    />
    <meta name="twitter:image" content="https://lounge.plustonic.com/og.png" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

      rel="stylesheet"
