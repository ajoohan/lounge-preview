<html lang="ko">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 공개 주소로 배포하더라도 검색엔진에는 걸리지 않게 한다 (내부 검토용 프로토타입) -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Lounge - AI Marketing Board</title>

    <!-- 링크를 카톡·메신저로 보낼 때의 미리보기.

    <meta property="og:site_name" content="Lounge" />
    <meta property="og:title" content="Lounge - AI Marketing Board" />

      property="og:description"

    <meta property="og:url" content="https://lounge.plustonic.com/" />
    <meta property="og:image" content="https://lounge.plustonic.com/og.png" />
    <meta property="og:image:width" content="1200" />

    />

 따릅니다."]},{heading:"처리 위탁",lines:["회사는 서비스 운영을 위해 아래와 같이 개인정보 처리 업무를 위탁하고 있습니다.","- Amazon Web Services : 클라우드 인프라 운영(데이터 보관·서버 운영), 안내 메일 발송","위탁받는 자가 개인정보를 안전하게 처리하도록 계약서에 관련 사항을 규정하고 있으며, 위탁 업무의 내용이나 위탁받는 자가 바뀌면 이 방침을 통해 알려드립니다.","개인정보는 국내(아시아 태평양 서울 리전)에 보관되며, 국외로 이전하지 않습니다."]},{heading:"안전성 확보 조치",lines:["저장 시 암호화 - 데이터베이스와 첨부 파일은 저장 단계에서 암호화됩니다.","전송 시 암호화 - 모든 통신은 TLS로 보호되며, 암호화되지 않은 접속은 거부됩니다.","접근 권한 최소화 - 이용자는 자기 역할에 필요한 자료만 볼 수 있도록 데이터베이스 단계에서 통제하며, 파트너에게는 청구 금액이 노출되지 않습니다.","운영자 화면은 이용자 화면과 다른 주소로 분리하여 운영합니다.","접속 기록을 90일간 보관하여 부정한 접근을 확인할 수 있도록 합니다.","가입은 회사가 발송한 초대 링크로만 가능하며, 링크는 7일이 지나면 만료되고 한 번만 쓸 수 있습니다."]},{heading:"자동으로 수집되는 정보",lines:["로그인 상태를 유지하기 위해 브라우저 저장소(local storage)에 인증 정보를 보관합니다.","광고나 이용 행태 분석을 위한 쿠키는 사용하지 않습니다.","브라우저 설정에서 저장을 거부할 수 있으나, 그 경우 화면을 옮길 때마다 다시 로그인해야 합니다."]},{heading:"동의를 거부할 권리",lines:["이용자는 동의를 거부할 수 있습니다. 다만 위 항목은 서비스 제공에 반드시 필요하여, 동의하지 않으면 서비스를 이용할 수 없습니다."]},{heading:"이용자의 권리",lines:["이용자는 언제든지 자신의 개인정보를 열람·정정·삭제하거나 처리 정지를 요구할 수 있습니다.","서비스 내 “내 정보” 화면에서 직접 고치거나, 아래 개인정보 보호책임자에게 연락하시면 지체 없이 처리합니다."]},{heading:"개인정보 보호책임자",lines:[`${Jt.company} · ${Jt.name} ${Jt.title}`,`${Jt.email} · ${Jt.phone}`,"개인정보 처리에 관한 문의·불만·피해 구제는 위 연락처로 접수해 주시면 지체 없이 답변드립니다."]},{heading:"권익 침해 구제 방법",lines:["개인정보 침해로 인한 상담·신고가 필요하시면 아래 기관에 문의하실 수 있습니다.","- 개인정보 분쟁조정위원회 (국번없이 1833-6972 · kopico.go.kr)","- 개인정보 침해신고센터 (국번없이 118 · privacy.kisa.or.kr)","- 대검찰청 사이버수사과 (국번없이 1301 · spo.go.kr)","- 경찰청 사이버수사국 (국번없이 182 · ecrm.police.go.kr)"]}]}],E_=()=>gn.map(t=>({id:t.id,version:t.version})),K0=Object.freeze(Object.defineProperty({__proto__:null,PRIVACY_OFFICER:Jt,TERMS:gn,consentRecord:E_},Symbol.toStringTag,{value:"Module"})),G0={partner:"m/invite",client:"client/invite",admin:"admin/invite"};function Lo(t,n){const{origin:i,pathname:r}=window.location;return`${i+(r.endsWith("/")?r:r+"/")}#/${G0[t]}?token=${encodeURIComponent(n)}`}function Ao(t,n,i,r={}){return X("/invites",{method:"POST",body:{role:t,name:n,email:i,payload:r}})}function uh(t){retu
