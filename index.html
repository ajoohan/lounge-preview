<html lang="ko">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 공개 주소로 배포하더라도 검색엔진에는 걸리지 않게 한다 (내부 검토용 프로토타입) -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- 링크를 카톡·메신저로 보낼 때의 미리보기.

    <meta property="og:image" content="https://lounge.plustonic.com/og.png" />
