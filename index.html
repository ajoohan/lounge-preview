 조건에서 정한 바에 따릅니다.","이 약관은 개별 발주의 대가·기간 등 계약 조건을 대체하지 않습니다."]},{heading:"제7조 (정산)",lines:["대금은 게시와 성과 등록이 완료된 달의 다음 달 지정일에 지급합니다.","개인 파트너의 경우 관계 법령에 따른 원천징수 후 지급합니다.","정산에 필요한 계좌·증빙 정보는 이용자가 직접 등록합니다."]},{heading:"제8조 (이용 중지와 해지)",lines:["이용자는 언제든 담당자에게 요청하여 이용을 종료할 수 있습니다.","회사는 이용자가 이 약관을 중대하게 위반한 경우 이용을 제한할 수 있으며, 사전에 사유를 알립니다."]},{heading:"제9조 (책임)",lines:["회사는 천재지변, 통신 장애 등 회사의 통제를 벗어난 사유로 발생한 손해에 대해 책임을 지지 않습니다.","이 약관에서 정하지 않은 사항은 관계 법령과 상관례에 따릅니다."]}]},{id:"privacy",label:"개인정보 수집·이용 동의",version:"v1.0",required:!0,body:[{heading:"수집하는 항목",lines:["공통 — 이름, 이메일, 휴대폰 번호, 접속 기록, 서비스 이용 기록","파트너 — 활동 채널 정보, 정산용 계좌 정보, 사업자 정보(사업자로 가입한 경우), 본인확인 결과","클라이언트 — 소속 사업자 정보, 담당자 연락처"]},{heading:"이용 목적",lines:["계정 식별과 로그인, 발주·검수 진행 상황 안내","대금 정산과 관계 법령에 따른 세무 신고","문의 응대와 분쟁 처리"]},{heading:"보유 기간",lines:["계정 정보는 이용 종료 시까지 보유하며, 종료 후 지체 없이 파기합니다.","다만 전자상거래 등에서의 소비자보호에 관한 법률, 국세기본법 등 관계 법령이 정한 기간 동안에는 해당 기록을 보관합니다."]},{heading:"제3자 제공",lines:["회사는 이용자의 개인정보를 제3자에게 제공하지 않습니다.","다만 법령에 근거한 요청이 있는 경우에는 관계 법령이 정한 절차에 따릅니다."]},{heading:"동의를 거부할 권리",lines:["이용자는 동의를 거부할 수 있습니다. 다만 위 항목은 서비스 제공에 반드시 필요하여, 동의하지 않으면 서비스를 이용할 수 없습니다."]}]}];function Ld({agreed:a,onChange:c}){const[o,d]=_.useState({}),p=Fs.every(h=>a[h.id]),x=()=>c(Object.fromEntries(Fs.map(h=>[h.id,!p]))),g=h=>c({...a,[h]:!a[h]});return n.jsxs("div",{className:"terms",children:[n.jsxs("label",{className:"terms__all",children:[n.jsx("input",{type:"checkbox",checked:p,onChange:x}),"전체 동의"]}),Fs.map(h=>{const m=!!o[h.id];return n.jsxs("div",{className:"terms__item",children:[n.jsxs("div",{className:"terms__head",children:[n.jsx("input",{type:"checkbox",id:`term-${h.id}`,checked:!!a[h.id],onChange:()=>g(h.id)}),n.jsx("label",{className:"terms__label",htmlFor:`term-${h.id}`,children:h.label}),n.jsx("button",{type:"button",className:"terms__toggle","aria-expanded":m,"aria-controls":`term-body-${h.id}`,"aria-label":`${h.label} 내용 ${m?"접기":"보기"}`,onClick:()=>d(w=>({...w,[h.id]:!w[h.id]})),children:n.jsx("svg",{viewBox:"0 0 16
