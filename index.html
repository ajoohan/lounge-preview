<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 공개 주소로 배포하더라도 검색엔진에는 걸리지 않게 한다 (내부 검토용 프로토타입) -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Lounge - AI Marketing Board</title>

    <!-- 링크를 카톡·메신저로 보낼 때의 미리보기.
         초대는 링크로 오간다 - 미리보기가 없으면 받는 쪽에서 무엇인지 알 수 없어
         낯선 주소로 보인다. 이미지는 절대 주소여야 읽힌다 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lounge" />
    <meta property="og:title" content="Lounge - AI Marketing Board" />
    <meta
      property="og:description"
      content="마케팅 협업 보드 · 프로젝트 · 검수 · 정산을 한번에."
    />
    <meta property="og:url" content="https://lounge.plustonic.com/" />
    <meta property="og:image" content="https://lounge.plustonic.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:title" content="Lounge - AI Marketing Board" />
    <meta
      name="twitter:description"
      content="마케팅 협업 보드 · 프로젝트 · 검수 · 정산을 한번에."
    />
    <meta name="twitter:image" content="https://lounge.plustonic.com/og.png" />

는 서비스의 내용을 개선하기 위해 기능을 변경할 수 있으며, 중요한 변경은 사전에 알립니다."]},{heading:"제5조 (이용자의 의무)",lines:["파트너는 관계 법령이 정한 광고 표기 의무를 준수해야 합니다.","이용자는 서비스에서 알게 된 상대방의 영업상 정보를 제3자에게 공개해서는 안 됩니다.","이용자는 사실과 다른 성과 수치를 등록해서는 안 됩니다."]},{heading:"제6조 (산출물의 권리)",lines:["산출물의 저작권은 개별 발주 조건에서 정한 바에 따릅니다.","이 약관은 개별 발주의 대가·기간 등 계약 조건을 대체하지 않습니다."]},{heading:"제7조 (정산)",lines:["대금은 게시와 성과 등록이 완료된 달의 다음 달 지정일에 지급합니다.","개인 파트너의 경우 관계 법령에 따른 원천징수 후 지급합니다.","정산에 필요한 계좌·증빙 정보는 이용자가 직접 등록합니다."]},{heading:"제8조 (이용 중지와 해지)",lines:["이용자는 언제든 담당자에게 요청하여 이용을 종료할 수 있습니다.","회사는 이용자가 이 약관을 중대하게 위반한 경우 이용을 제한할 수 있으며, 사전에 사유를 알립니다."]},{heading:"제9조 (책임)",lines:["회사는 천재지변, 통신 장애 등 회사의 통제를 벗어난 사유로 발생한 손해에 대해 책임을 지지 않습니다.","이 약관에서 정하지 않은 사항은 관계 법령과 상관례에 따릅니다."]}]},{id:"privacy",label:"개인정보 수집·이용 동의",version:"v1.2",required:!0,body:[{heading:"수집하는 항목",lines:["공통 - 이름, 이메일, 휴대폰 번호, 접속 기록, 서비스 이용 기록","파트너 - 활동 채널 정보, 정산용 계좌 정보, 사업자 정보(사업자로 가입한 경우), 본인확인 결과","클라이언트 - 소속 사업자 정보, 담당자 연락처"]},{heading:"이용 목적",lines:["계정 식별과 로그인, 발주·검수 진행 상황 안내","대금 정산과 관계 법령에 따른 세무 신고","문의 응대와 분쟁 처리"]},{heading:"보유 기간",lines:["계정 정보는 이용 종료 시까지 보유하며, 종료 후 지체 없이 파기합니다.","접속 기록은 90일간 보관한 뒤 자동으로 삭제됩니다.","다만 전자상거래 등에서의 소비자보호에 관한 법률, 국세기본법 등 관계 법령이 정한 기간 동안에는 해당 기록을 보관합니다.","- 계약·청약철회 기록 5년 / 대금 결제 및 재화 공급 기록 5년 / 소비자 불만·분쟁 처리 기록 3년"]},{heading:"파기 절차와 방법",lines:["보유 기간이 지나거나 처리 목적이 이루어진 개인정보는 지체 없이 파기합니다.","전자적 파일 형태는 복구할 수 없는 방법으로 삭제하고, 출력물은 분쇄하거나 소각합니다.","법령에 따라 보관해야 하는 기록은 다른 개인정보와 분리하여 저장·관리합니다."]},{heading:"제3자 제공",lines:["회사는 이용자의 개인정보를 제3자에게 제공하지 않습니다.","다만 법령에 근거한 요청이 있는 경우에는 관계 법령이 정한 절차에 따릅니다."]},{heading:"처리 위탁",lines:["회사는 서비스 운영을 위해 아래와 같이 개인정보 처리 업무를 위탁하고 있습니다.","- Amazon Web Services : 클라우드 인프라 운영(데이터 보관·서버 운영), 안내 메일 발송","위탁받는 자가 개인정보를 안전하게 처리하도록 계약서에 관련 사항을 규정하고 있으며, 위탁 업무의 내용이나 위탁받는 자가 바뀌면 이 방침을 통해 알려드립니다.","개인정보는 국내(아시아 태평양 서울 리전)에 보관되며, 국외로 이전하지 않습니다."]},{heading:"안전성 확보 조치",lines:["저장 시 암호화 - 데이터베이스와 첨부 파일은 저장 단계에서 암호화됩니다.","전송 시 암호화 - 모든 통신은 TLS로 보호되며, 암호화되지 않은 접속은 거부됩니다.","접근 권한 최소화 - 이용자는 자기 역할에 필요한 자료만 볼 수 있도록 데이터베이스 단계에서 통제하며, 파트너에게는 청구 금액이 노출되지 않습니다.","운영자 화면은 이용자 화면과 다른 주소로 분리하여 운영합니다.","접속 기록을 90일간 보관하여 부정한 접근을 확인할 수 있도록 합니다.","가입은 회사가 발송한 초대 링크로만 가능하며, 링크는 7일이 지나면 만료되고 한 번만 쓸 수 있습니다."]},{heading:"자동으로 수집되는 정보",lines:["로그인 상태를 유지하기 위해 브라우저 저장소(local storage)에 인증 정보를 보관합니다.","광고나 이용 행태 분석을 위한 쿠키는 사용하지 않습니다.","브라우저 설정에서 저장을 거부할 수 있으나, 그 경우 화면을 옮길 때마다 다시 로그인해야 합니다."]},{heading:"동의를 거부할 권리",lines:["이용자는 동의를 거부할 수 있습니다. 다만 위 항목은 서비스 제공에 반드시 필요하여, 동의하지 않으면 서비스를 이용할 수 없습니다."]},{heading:"이용자의 권리",lines:["이용자는 언제든지 자신의 개인정보를 열람·정정·삭제하거나 처리 정지를 요구할 수 있습니다.","서비스 내 “내 정보” 화면에서 직접 고치거나, 아래 개인정보 보호책임자에게 연락하시면 지체 없이 처리합니다."]},{heading:"개인정보 보호책임자",lines:[`${Es.company} · ${Es.name} ${Es.title}`,`${Es.email} · ${Es.phone}`,"개인정보 처리에 관한 문의·불만·피해 구제는 위 연락처로 접수해 주시면 지체 없이 답변드립니다."]},{heading:"권익 침해 구제 방법",lines:["개인정보 침해로 인한 상담·신고가 필요하시면 아래 기관에 문의하실 수 있습니다.","- 개인정보 분쟁조정위원회 (국번없이 1833-6972 · kopico.go.kr)","- 개인정보 침해신고센터 (국번없이 118 · privacy.kisa.or.kr)","- 대검찰청 사이버수사과 (국번없이 1301 · spo.go.kr)","- 경찰청 사이버수사국 (국번없이 182 · ecrm.police.go.kr)"]}]}],ov=()=>Ln.map(t=>({id:t.id,version:t.version})),$1=Object.freeze(Object.defineProperty({__proto__:null,PRIVACY_OFFICER:Es,TERMS:Ln,consentRecord:ov},Symbol.toStringTag,{value:"Module"})),P1={partner:"m/invite",client:"client/invite",admin:"admin/invite"};function nh(t,s){const{origin:i,pathname:r}=window.location;return`${i+(r.endsWith("/")?r:r+"/")}#/${P1[t]}?token=${encodeURIComponent(s)}`}async function cv(t,s){const{copyText:i}=await da(async()=>{const{copyText:o}=await Promise.resolve().then(()=>M1);return{copyText:o}},void 0,import.meta.url),r=await Q(`/admin/invites/${encodeURIComponent(s)}/extend`,{method:"POST"});await i(nh(t,r.token),`초대 링크를 복사했습니다 - ${r.expires_on} 까지 쓸 수 있습니다`)}function sc(t,s,i,r={}){return Q("/invites",{method:"POST",body:{role:t,name:s,email:i,payload:r}})}function Hh(t){return Q(`/invites/${encodeURIComponent(t)}`,{auth:!1})}function Kh(t,s,i){return Q("/invites/accept",{method:"POST",body:{token:t,password:s,profile:i,consen
